<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisi alimento – Nasometro 2.0</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
body { font-family: system-ui; background:#f9fafb; margin:0; }
.container { max-width:600px; margin:auto; padding:1rem; }
.card { background:white; padding:1rem; border-radius:12px; }
input,select,textarea,button { width:100%; margin-top:8px; padding:8px; }
.result { margin-top:1rem; font-size:1.2rem; font-weight:bold; }
</style>
</head>

<body>
<div class="container">
<div class="card">

<h2>Analizza alimento</h2>

<input id="name" placeholder="Nome alimento">

<select id="category">
<option value="">Categoria</option>
<option value="carne">Carne</option>
<option value="latticini">Latticini</option>
<option value="verdura">Verdura</option>
<option value="cotti">Cotti</option>
<option value="altro">Altro</option>
</select>

<input type="date" id="openedDate">

<select id="location">
<option value="frigo">Frigo</option>
<option value="dispensa">Dispensa</option>
<option value="freezer">Freezer</option>
</select>

<input type="file" id="photo">

<input type="password" id="apiKey" placeholder="Groq API key">

<button id="analyze">Analizza con AI</button>
<button id="calc">Calcola freschezza</button>

<div class="result" id="result"></div>

</div>
</div>

<script>
lucide.createIcons();

let aiScore = null;
let aiData = null;

function daysSince(date){
 return Math.floor((Date.now()-new Date(date))/86400000);
}

function computeLocal(fd){
 let d = daysSince(fd.openedDate);
 let risk = {carne:2,latticini:1.5,cotti:1.5,verdura:1}[fd.category]||1;
 if(fd.location==="dispensa") risk+=1;
 if(fd.location==="freezer") risk-=1;
 return Math.max(0,100-(risk+d*0.7)*6);
}

document.getElementById("analyze").onclick = async ()=>{
 const key = apiKey.value;
 const file = photo.files[0];
 if(!key||!file)return alert("Serve API key e foto");

 const reader = new FileReader();
 reader.onload = async ()=>{
  const base64 = reader.result.split(',')[1];

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{
    Authorization:`Bearer ${key}`,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({
    model:"meta-llama/llama-4-scout-17b-16e-instruct",
    messages:[{
     role:"user",
     content:[
      {type:"image_url",image_url:{url:`data:image/jpeg;base64,${base64}`}},
      {type:"text",text:`Analizza questo alimento e rispondi SOLO JSON:
{
"nome":"",
"categoria":"carne|latticini|verdura|cotti|altro",
"rischio":"basso|medio|alto"
}`}
     ]
    }]
   })
  });

  const data = await res.json();
  const parsed = JSON.parse(data.choices[0].message.content);

  aiData = parsed;

  name.value = parsed.nome;
  category.value = parsed.categoria;

  aiScore = {basso:80,medio:50,alto:20}[parsed.rischio];

  alert("AI completata");
 };
 reader.readAsDataURL(file);
};

document.getElementById("calc").onclick = ()=>{
 const fd = {
  name:name.value,
  category:category.value,
  openedDate:openedDate.value,
  location:location.value
 };

 let local = computeLocal(fd);
 let final = local;

 if(aiScore){
  final = Math.round(local*0.6 + aiScore*0.4);
 }

 let status = final>60?"OK":final>35?"ATTENZIONE":"RISCHIO";

 result.innerText = `${final}% - ${status}`;

 // salva
 let list = JSON.parse(localStorage.getItem("recent")||"[]");

 list.unshift({
  name:fd.name,
  status:status==="OK"?"ok":status==="ATTENZIONE"?"soon":"bad",
  date:new Date().toLocaleDateString("it-IT"),
  location:fd.location,
  timestamp:Date.now()
 });

 localStorage.setItem("recent",JSON.stringify(list.slice(0,20)));
};
</script>

</body>
</html>
