<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasometro 2.0</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
body{font-family:system-ui;background:#f9fafb;margin:0}
.container{max-width:700px;margin:auto;padding:1rem}
.card{background:white;padding:1rem;border-radius:12px;margin-bottom:1rem}
.item{display:flex;justify-content:space-between;padding:6px 0}
.bad{color:red}
.warn{color:orange}
.ok{color:green}
</style>
</head>

<body>
<div class="container">

<h2>Dashboard Nasometro</h2>

<div class="card" id="alertBox"></div>

<div class="card">
<h3>Priorità consumo</h3>
<div id="priority"></div>
</div>

<div class="card">
<h3>Ultime analisi</h3>
<div id="recent"></div>
</div>

</div>

<script>
lucide.createIcons();

const items = JSON.parse(localStorage.getItem("recent")||"[]");

function daysAgo(ts){
 return Math.floor((Date.now()-ts)/86400000);
}

function priorityScore(i){
 let s=0;
 if(i.status==="bad")s+=3;
 if(i.status==="soon")s+=2;
 if(daysAgo(i.timestamp)>3)s+=1;
 return s;
}

const priority = [...items].sort((a,b)=>priorityScore(b)-priorityScore(a)).slice(0,3);

const pDiv = document.getElementById("priority");
priority.forEach(i=>{
 pDiv.innerHTML+=`<div class="item">
 <span>${i.name}</span>
 <span class="${i.status}">${i.status}</span>
 </div>`;
});

const rDiv = document.getElementById("recent");
items.slice(0,5).forEach(i=>{
 rDiv.innerHTML+=`<div class="item">
 <span>${i.name}</span>
 <span>${i.date}</span>
 </div>`;
});

// alert intelligente
let bad = items.filter(i=>i.status==="bad").length;
let soon = items.filter(i=>i.status==="soon").length;

let msg="";

if(bad>0) msg=`⚠️ ${bad} alimenti a rischio`;
else if(soon>0) msg=`⏳ ${soon} da consumare presto`;
else msg="✅ Tutto sotto controllo";

alertBox.innerText = msg;
</script>

</body>
</html>
